<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animated Products</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Loading Spinner -->
    <div class="loader">
        <div class="spinner"></div>
        <p>Loading...</p>
    </div>

    <!-- Animamted Navigation -->
    <nav>
        <a href="#">🏠 Home</a>
        <a href="#">🛍️ Products</a>
        <a href="#">ℹ️ About</a>
        <a href="#">📞 Contact</a>
    </nav>

    <!-- Hero Section with Animated Background -->
    <header class="hero">
        <h1>Our Amazing Products</h1>
        <p>Best deals with cool animations</p>
        <button class="cta-btn">Shop Now</button>
        <div class="decorative"></div>
    </header>

    <!-- Featured Products - 6 Cards -->
     <div class="products-container">

      <div class="card card-1">
           <div class="icon">🎧</div>
           <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=600&q=80" alt=" Wireless Headphones"
           <h2>Wireless Headphones</h2>
           <p class="price">R899.99</p>
           <button>Add to Cart</button>
     </div>

     <div class="card card-2">
        <div class="icon">⌚</div>
        <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=600&q=80" alt="Smart Watch">
        <h2>Smart Watch</h2>
        <p class="price">R1,499.99</p>
        <button>Add to Cart</button>
     </div>

     <div class="card card-3">
         <div class="icon">💻</div>
         <img src="https://images.unsplash.com/photo-1496181133206-80ce9b88a853?auto=format&fit=crop&w=600&q=80" alt="Laptop Stand">
         <h2>Laptop Stand</h2>
         <p class="price">R349.99</p>
         <button>Add to Cart</button>
     </div>

     <div class="card card-4">
         <div class="icon">🖱️</div>
         <img src="https://images.unsplash.com/photo-1527864550417-7fd91fc51a46?auto=format&fit=crop&w=600&q=80" alt="Mouse">
         <h2>Wireless Mouse</h2>
         <p class="price">R299.99</p>
         <button>Add to Cart</button>
     </div>

     <div class="card card-5">
         <div class="icon">⌨️</div>
         <img src="https://images.unsplash.com/photo-1587829741301-dc798b83add3?auto=format&fit=crop&w=600&q=80" alt="Keyboard">
         <h2>Mechanical Keyboard</h2>
         <p class="price">R1,199.99</p>
         <button>Add to Cart</button>
     </div>

     <div class="card card-6">
         <div class="icon">🔌</div>
         <img src="https://images.unsplash.com/photo-1583863788434-e58a36330cf0?auto=format&fit=crop&w=600&q=80" alt=" Fast Charger"
         <h2>Fast Charger</h2>
         <p class="price">R199.99</p>
         <button>Add to Cart</button>
     </div>

     </main>
  
</body>
</html>
